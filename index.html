<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Martini">
<meta name="theme-color" content="#0B0E17">
<title>Martini rozvoz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E84C2B'/%3E%3Cpath d='M12 22h24l8 10h8v10H12z' fill='white'/%3E%3Ccircle cx='22' cy='44' r='5' fill='%23E84C2B' stroke='white' stroke-width='3'/%3E%3Ccircle cx='44' cy='44' r='5' fill='%23E84C2B' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23E84C2B'/%3E%3Cpath d='M36 64h66l24 28h20v28H36z' fill='white'/%3E%3Ccircle cx='62' cy='124' r='14' fill='%23E84C2B' stroke='white' stroke-width='8'/%3E%3Ccircle cx='124' cy='124' r='14' fill='%23E84C2B' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Martini rozvoz – tmavý vzhled inspirovaný kurýrními appkami, akcent červená */
:root{
  --bg:#0B0E17; --card:#161A27; --card2:#1E2332; --top:#0B0E17;
  --red:#E8402B; --red-ink:#FF7A66; --red-deep:#B8301F; --blue:#3D8FD9; --green:#4DB84C; --green-ink:#2E8B2D;
  --line:rgba(255,255,255,.08); --field:#2B3146; --soft:rgba(255,255,255,.08);
  --ink:#EDEAE5; --muted:#8E93AB; --faint:#5C6178;
  --ease:cubic-bezier(.32,.72,0,1);
  --head:"Fira Sans",-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:17px/1.4 "Fira Sans",-apple-system,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
a{color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid rgba(232,64,43,.6);outline-offset:2px}
button:active,a:active{transform:scale(.97);transition:transform .1s}

/* horní lišta */
.top{position:sticky;top:0;z-index:20;background:var(--top);padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;display:flex;align-items:center;gap:8px}
.rbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.rbtn svg{width:24px;height:24px}
.brand{flex:1;line-height:1.15;padding-left:4px}
.brand b{display:block;font:900 22px/1.1 var(--head);letter-spacing:-.01em;white-space:nowrap}
.brand span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(77,184,76,.2)}
.cam{height:46px;padding:0 16px 0 13px;border-radius:999px;display:flex;align-items:center;gap:8px;background:var(--red);color:#fff;font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(232,64,43,.35)}
.cam svg{width:24px;height:24px}

/* záložky */
.tabs{display:flex;align-items:center;gap:6px;background:var(--top);padding:4px 10px 8px;position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:19}
.tabs .tb{height:34px;padding:0 11px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);background:var(--card);white-space:nowrap}
.tabs .tb.on{background:var(--ink);color:#0B0E17}
.tabs .route{display:flex;align-items:center;justify-content:center;gap:4px;height:34px;width:34px;padding:0;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px;background:var(--card)}
.tabs .route svg{width:17px;height:17px}
.tabs .route.on{color:#fff;background:var(--red)}
.sum{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:15px;white-space:nowrap;flex:none}
.sum b{color:#7CDB7B;font-weight:700}
.sum svg{width:19px;height:19px;color:#7CDB7B}
@media(max-width:370px){.tabs .tb{padding:0 9px}.tabs{gap:4px;padding-left:8px;padding-right:8px}.sum svg{display:none}}
@media(max-width:330px){.tabs .tb{font-size:13px;padding:0 8px}.sum{font-size:14px}}
main{max-width:640px;margin:0 auto;padding-top:2px}
.stop{width:24px;height:24px;border-radius:50%;background:#fff;color:#111;font-weight:800;font-size:14px;display:grid;place-items:center;flex:none;margin-right:-2px}
.eta{font-size:14px;color:var(--muted);white-space:nowrap;flex:none}
.eta b{color:var(--ink);font-weight:600}
.rinfo{display:flex;align-items:center;gap:6px;margin:2px 12px 8px;font-size:13px;color:var(--muted)}
.rinfo svg{width:15px;height:15px}
.rinfo b{color:var(--ink)}

/* karta objednávky */
.card{background:var(--card);margin:0 8px 8px;border-radius:18px;overflow:hidden}
.strip{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;color:#fff;background:var(--blue)}
.pay-hotove .strip{background:var(--red)} .st-dorucena .strip{background:var(--green-ink)}
.strip .veze{width:20px;height:20px;margin-left:-4px;opacity:.95}
.strip b{font-size:20px;font-weight:700;min-width:46px}
.cash{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:9px;background:#fff;color:#1E7A1D;font-size:18px;font-weight:800;white-space:nowrap}
.cash svg{width:20px;height:20px;stroke-width:2.2}
.cash.kart{color:#0B5CAD}
.cash.paid{background:rgba(255,255,255,.22);color:#fff;font-size:15px;font-weight:600}
.cash.unk{background:rgba(255,255,255,.22);color:#fff;font-size:15px}
.strip .tm{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:17px;font-weight:600;white-space:nowrap}
.strip .tm svg{width:18px;height:18px}
.strip .tm em{font-style:normal;font-weight:700;font-size:15px;background:rgba(255,255,255,.22);border-radius:7px;padding:1px 6px}
.late .strip .tm em{background:#fff;color:var(--red-deep)}
.cbody{display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;min-height:44px}
.addr{flex:1;display:flex;align-items:baseline;gap:8px;overflow:hidden;white-space:nowrap}
.addr b{font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.addr span{font-size:14px;color:var(--muted);flex:none}
.toggle{width:44px;height:44px;display:grid;place-items:center;flex:none}
.toggle span{width:30px;height:30px;border-radius:50%;background:var(--card2);color:var(--ink);display:grid;place-items:center;transition:transform .3s var(--ease)}
.open .toggle span{transform:rotate(180deg)}
.toggle svg{width:18px;height:18px;stroke-width:3}
.det{display:none;padding:2px 12px 10px}
.open .det{display:block}
.dr{display:flex;align-items:center;gap:12px;padding:5px 0;font-size:16px;text-decoration:none}
.dr .ico{width:30px;height:30px;border-radius:50%;background:var(--card2);color:var(--red-ink);display:grid;place-items:center;flex:none}
.dr .ico svg{width:16px;height:16px}
.dr b{font-weight:700}
a.dr{color:var(--ink)}
.items{border-top:1px solid var(--line);margin:8px -12px 0;padding:8px 12px 0}
.it{display:flex;gap:12px;padding:3px 0;font-size:16px}
.it .q{width:26px;flex:none;color:var(--muted)}
.it .ex{display:block;margin-left:-14px;color:var(--muted);font-size:15px}
.it .ex::before{content:"+ "}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tool{height:38px;padding:0 12px;border-radius:999px;background:var(--card2);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.tool svg.i{width:17px;height:17px}
.tool.red{color:var(--red-ink)}
.bar{display:flex;border-top:1px solid var(--line);height:46px}
.bar>*{height:100%}
.call,.nav{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--card)}
.call{width:52px;flex:none;border-left:1px solid var(--line)}
.nav{flex:1;border-left:1px solid var(--line)}
.call svg,.nav svg{width:20px;height:20px}
.call.off,.nav.off{opacity:.3;pointer-events:none}
.back{flex:1.3;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;background:var(--card2)}
.slide{flex:1.3;position:relative;background:var(--green);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.st-jedu .slide{background:#3DA53C}
.slide .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:42px;color:#fff;font-size:15px;font-weight:700;pointer-events:none;white-space:nowrap}
.slide .lbl::after{content:"›››";margin-left:5px;letter-spacing:-1px;opacity:.7;animation:hint 1.6s infinite}
@keyframes hint{50%{opacity:.25}}
.slide .knob{position:absolute;left:4px;top:4px;bottom:4px;width:40px;border-radius:11px;background:#fff;color:var(--green-ink);display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.25);cursor:grab}
.slide .knob svg{width:22px;height:22px;stroke-width:2.6}
.slide.snap .knob{transition:transform .35s var(--ease)} .slide.snap .lbl{transition:opacity .35s}

.empty{text-align:center;padding:40px 24px;color:var(--muted)}
.empty .tile{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;margin:0 auto 16px;color:var(--red-ink)}
.empty .tile svg{width:34px;height:34px}
.empty h2{color:var(--ink);font:900 28px/1.1 var(--head);margin:0 0 8px}
.empty p{margin:0 0 20px;font-size:16px}
.btns{display:flex;flex-direction:column;gap:10px;max-width:340px;width:100%;margin:0 auto}
.btn{height:56px;border-radius:999px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);width:100%;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--red);color:#fff}
.btn.danger{background:rgba(232,64,43,.14);color:var(--red-ink)}
.btn[disabled]{opacity:.4}

/* mapa */
#mapWrap{display:none;position:relative;height:calc(100dvh - env(safe-area-inset-top) - 112px);margin:0 8px;border-radius:22px;overflow:hidden;background:#141826}
#mapWrap.on{display:block}
#map{position:absolute;inset:0}
.leaflet-container{background:#141826;font:inherit}
#map:not(.esri) .leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.82) contrast(.9) saturate(.35)}
.leaflet-control-attribution{background:rgba(11,14,23,.7)!important;color:#8E93AB!important;font-size:10px}
.leaflet-control-attribution a{color:#B5B9CC!important}
.leaflet-bar a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}
.mk{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:800;font-size:15px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.mk.cashm{background:var(--red)} .mk.cardm{background:var(--blue)}
.mk.me{width:22px;height:22px;background:#4AA8FF;border-width:4px;box-shadow:0 0 0 8px rgba(74,168,255,.25)}
.mk.piz{width:38px;height:38px;background:#fff;color:var(--red);border-color:var(--red)}
.mk.piz svg{width:20px;height:20px}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;z-index:500;background:rgba(22,26,39,.96);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.mapcard .big{font:900 34px/1 var(--head);letter-spacing:-.01em}
.mapcard .lbl2{color:var(--muted);font-size:14px;margin:4px 0 12px}
.mapcard .row{display:flex;gap:8px}
.mapcard .btn{height:50px;font-size:16px}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}

/* boční menu */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(86vw,380px);z-index:45;background:#121624;transform:translateX(-102%);transition:transform .35s var(--ease);overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 0 calc(20px + env(safe-area-inset-bottom))}
.drawer.on{transform:none}
.promo{width:calc(100% - 32px);text-align:left;color:#fff;margin:4px 16px 10px;border-radius:18px;padding:16px 18px;background:linear-gradient(120deg,#7A1E12,#E8402B);font-weight:700;font-size:18px;line-height:1.25;display:flex;align-items:center;gap:12px}
.promo small{display:block;font-weight:500;font-size:14px;opacity:.85;margin-top:2px}
.mi{display:flex;align-items:center;gap:18px;width:100%;padding:0 18px;min-height:68px;text-align:left;font-size:20px}
.mi svg{width:28px;height:28px;color:var(--ink)}
.mi .t{flex:1;display:flex;flex-direction:column;border-bottom:1px solid var(--line);min-height:68px;justify-content:center}
.mi .t small{font-size:16px;color:var(--muted)}
.mi .t small.on{color:#7CDB7B}
.mi:last-child .t{border:0}

/* stránky z menu */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateX(102%);transition:transform .35s var(--ease),visibility 0s .35s;visibility:hidden;overflow:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.page.on{transform:none;visibility:visible;transition:transform .35s var(--ease)}
.phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--bg)}
.phead .ttl{font:900 22px/1 var(--head);opacity:0;transition:opacity .2s}
.page.scrolled .phead{background:#151927}
.page.scrolled .phead .ttl{opacity:1}
.pbody{padding:6px 20px 0;max-width:640px;margin:0 auto}
.h1{font:900 42px/1.05 var(--head);letter-spacing:-.015em;margin:4px 0 18px}
.h2{font:900 26px/1.15 var(--head);margin:28px 0 12px}
.lead{font-size:18px;color:var(--ink);margin:0 0 6px}
.note2{font-size:14px;color:var(--muted)}
.bigcard{border-radius:22px;padding:22px;background:linear-gradient(135deg,#E8402B,#A8291A);color:#fff;position:relative;overflow:hidden}
.bigcard .n{font:900 64px/1 var(--head)}
.bigcard .l{font-weight:800;font-size:20px;margin-top:6px}
.bigcard svg.deco{position:absolute;right:-10px;bottom:-14px;width:150px;height:150px;opacity:.18;stroke-width:1.5}
.panel{background:var(--card);border-radius:22px;padding:20px}
.cap{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.money{font:900 46px/1.05 var(--head);margin:6px 0 14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.kv span:first-child{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:14px;letter-spacing:.03em}
.kv b{white-space:nowrap;font-weight:700}
.info{display:flex;gap:14px;align-items:flex-start;margin:16px 0 4px;font-size:17px}
.info svg{color:#7DB8F0;width:24px;height:24px;margin-top:1px}
.info.warn2 svg{color:#FF8A75}
.gauge{display:block;margin:6px auto 0;width:220px;height:130px}
.ring{display:block;margin:6px auto 0;width:190px;height:190px}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding:10px 0 0}
.bars i{flex:1;background:#2B3146;border-radius:6px 6px 3px 3px;min-height:6px;position:relative}
.bars i.hot{background:var(--red)}
.bars i span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);font-style:normal}
.tx{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.tx .a{flex:1}
.tx .a b{display:block;font-size:18px;font-weight:700}
.tx .a span{display:block;color:var(--muted);font-size:15px}
.tx .v{font-size:18px;font-weight:600;white-space:nowrap}
.tx .v.plus{color:#7CDB7B}
.dayh{font:900 22px/1.2 var(--head);margin:22px 0 4px}
.srow{display:flex;align-items:center;gap:14px;min-height:66px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:19px}
.srow .t{flex:1}
.srow .t small{display:block;font-size:15px;color:var(--muted)}
.srow .val{color:var(--muted)}
.srow svg.chev{width:20px;height:20px;color:var(--muted)}
.prof .lab{color:var(--muted);font-size:16px;margin-top:18px}
.prof .val{font-size:22px}

/* hodnocení */
.fb{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .4s var(--ease),visibility 0s .4s;visibility:hidden}
.fb.on{transform:none;visibility:visible;transition:transform .4s var(--ease)}
.fb .x{align-self:flex-end;width:48px;height:48px;display:grid;place-items:center}
.fb .x svg{width:30px;height:30px}
.stars{display:flex;justify-content:space-between;margin:34px 0 10px}
.stars button{width:60px;height:60px;display:grid;place-items:center;color:var(--red-ink)}
.stars svg{width:50px;height:50px;stroke-width:1.8}
.stars button.on svg{fill:var(--red-ink)}
.starl{display:flex;justify-content:space-between;color:var(--muted);font-size:15px}
.fb textarea{margin-top:34px;width:100%;min-height:64px;border-radius:999px;border:2px solid #33395A;background:transparent;padding:18px 24px;font-size:18px;resize:none;outline:none}
.fb textarea:focus{border-color:var(--red)}
.fb .grow{flex:1}

/* sheet (formuláře) */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;max-height:92dvh;display:flex;flex-direction:column;background:#121624;border-radius:26px 26px 0 0;
  transform:translateY(105%);transition:transform .4s var(--ease),visibility 0s .4s;visibility:hidden;box-shadow:0 -8px 32px rgba(0,0,0,.4);max-width:640px;margin:0 auto}
.sheet.on{transform:none;visibility:visible;transition:transform .4s var(--ease)}
#ov{z-index:54}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 2px;position:relative}
.sh-head::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:9px;background:rgba(255,255,255,.2)}
.sh-head h3{margin:14px 0 4px;font-size:17px;font-weight:700}
.sh-head button{height:44px;padding:0 12px;font-size:17px;color:var(--red-ink);margin-top:10px;min-width:84px}
.sh-head .save{font-weight:800}
.sh-body{overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 4px 5px}
.fld input,.fld textarea{width:100%;border:1px solid var(--field);background:var(--card);border-radius:14px;padding:12px;font-size:16px;outline:none}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(232,64,43,.2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px}
.seg button{flex:1;height:40px;border-radius:999px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:#0B0E17}
.hint{font-size:13px;color:var(--muted);margin:-6px 4px 12px}
.prev{display:block;width:100%;max-height:220px;object-fit:contain;border-radius:16px;background:var(--card);margin-bottom:12px}

/* ================= verze + automatická aktualizace ================= */
const APP_VERSION='2026-11-24.4';
let updChecked=0;
async function checkUpdate(){
  if(!/^https?:$/.test(location.protocol)||Date.now()-updChecked<60000)return;updChecked=Date.now();
  try{
    const t=await (await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION&&!document.querySelector('.sheet.on')){
      try{sessionStorage.setItem('martini.updated',m[1])}catch(e){}
      location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
    }
  }catch(e){}
}
// adresa zůstává vždy stejná (odstraní ?v=… po aktualizaci)
if(location.search&&history.replaceState)history.replaceState(null,'',location.pathname+location.hash);
checkUpdate();window.__ver=APP_VERSION;window.__upd=()=>{updChecked=0;return checkUpdate()};

/* ================= ikony a pomocníci ================= */
const P={

  star:'<polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"/>',

  ccard:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',

  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  note:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M8 7h8M8 11h8M8 15h5"/>',
  cam:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  right:'<path d="m9 18 6-6-6-6"/>',
  undo:'<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
  check:'<path d="M20 6 9 17l-5-5"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kc=n=>(Math.round((+n||0)*100)/100).toLocaleString('cs-CZ')+' Kč';

/* ================= úložiště ================= */
const KEY='martini.orders.v2', SKEY='martini.settings.v3';
let orders=[], settings={city:'Dobříš',navApp:'mapy',sort:'time'}, tab='A';
const opened=new Set();
try{orders=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
try{Object.assign(settings,JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch(e){}
function save(){
  const w=()=>localStorage.setItem(KEY,JSON.stringify(orders));
  try{w()}catch(e){
    orders.forEach(o=>{if(o.status==='dorucena')o.photo=''});
    try{w()}catch(e2){orders.forEach(o=>o.photo='');try{w()}catch(e3){}}
  }
}
const saveSettings=()=>{try{localStorage.setItem(SKEY,JSON.stringify(settings))}catch(e){}};

/* ================= čtení účtenky Speedlo ================= */
const NAME_RE=/^[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][a-záčďéěíňóřšťúůýž]+(?:[ -][A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][a-záčďéěíňóřšťúůýž.]+){1,2}$/;
const PHONE_RE=/(?:^|[^\d])(?:\+?\s?420[\s.-]?)?(\d{3})[\s.-]?(\d{3})[\s.-]?(\d{3})(?!\d)/;
function amountIn(l){
  const ms=[...l.matchAll(/(\d{1,3}(?:[  ]\d{3})+|\d+)(?:[.,](\d{1,2}))?\s*(?=kč|kc|czk|,-)/gi)];
  if(!ms.length)return null;const m=ms[ms.length-1];
  return parseFloat(m[1].replace(/[  ]/g,'')+'.'+(m[2]||'0'));
}
const stripPrice=s=>s.replace(/(\s+\d[\d  .,]*\s*(kč|kc|czk|,-)\.?)+\s*$/i,'').replace(/[|]+$/,'').trim();
function itemsFromLines(lines){
  const items=[];
  for(const l of lines){
    if(items.length&&(/^(celkem|dph|hotov|kart|platba|vybrat|doru)/i.test(l.replace(/^[^\p{L}\d+]+/u,''))||PHONE_RE.test(l)))break;
    const m=l.match(/^([1-9lI|]\d?)\s*(?:[x×X*]|ks)\s*(.+)$/);
    if(m){const name=stripPrice(m[2]);if(name)items.push({q:parseInt(m[1].replace(/[lI|]/,'1'),10)||1,name,ex:[]})}
    else if(/^[+•–-]\s*\S/.test(l)&&items.length){const e=stripPrice(l.replace(/^[+•–-]\s*/,''));if(e)items[items.length-1].ex.push(e)}
  }
  return items;
}
function detectPay(t){t=t.toLowerCase();
  if(/hotov|cash/.test(t))return 'hotove';
  if(/kart|termin/.test(t))return 'karta';
  if(/online|zaplacen|uhrazen|předem|predem|gopay|comgate|stripe|qr/.test(t))return 'zaplaceno';
  return '';
}
function parseReceipt(text){
  const L=text.replace(/\r/g,'').split('\n').map(l=>l.replace(/[ \t]+/g,' ').replace(/^[^\p{L}\d+#]+/u,'').replace(/[|\s]+$/g,'').trim()).filter(Boolean);
  const o={num:'',street:'',city:'',name:'',phone:'',total:'',collect:'',pay:'',note:'',deliverAt:'',deliverDate:'',items:[]};
  // číslo objednávky = samotné krátké číslo na řádku (Speedlo ho tiskne nahoru i k adrese)
  const numIdx=L.map((l,i)=>/^\D{0,2}\d{1,4}\D{0,1}$/.test(l)?i:-1).filter(i=>i>=0);
  if(numIdx.length)o.num=L[numIdx[0]].replace(/\D/g,'');
  // telefon zákazníka – poslední telefon (nahoře je hlavička pizzerie)
  let pi=-1;
  L.forEach((l,i)=>{if(!/ič|dič|kč|kc|účtenk|provoz/i.test(l)&&PHONE_RE.test(l))pi=i});
  if(pi>=0){const m=L[pi].match(PHONE_RE);o.phone=`${m[1]} ${m[2]} ${m[3]}`}
  // adresa = řádek nad telefonem, jméno = řádek pod telefonem
  if(pi>0){
    let a=L[pi-1];
    if(/^\D{0,2}\d{1,4}\D{0,1}$/.test(a)&&pi>1)a='';
    if(a&&/[a-zá-ž]/i.test(a)){
      const [s,...c]=a.split(',');o.street=s.trim();o.city=c.join(',').replace(/\d{3}\s?\d{2}/,'').trim();
    }
    const n=L[pi+1];
    if(n&&!/doru|platb|vybrat/i.test(n))o.name=n.replace(/[^A-Za-zÁ-ž .-]/g,'').trim();
  }
  // čas doručení
  const di=L.findIndex(l=>/doru[čc]it/i.test(l));
  if(di>=0){
    const m=L[di].match(/(\d{1,2})\.\s?(\d{1,2})\.?\s*v?\s*(\d{1,2})[:.](\d{2})/)||L[di].match(/(\d{1,2})[:.](\d{2})/);
    if(m&&m.length===5){o.deliverDate=`${+m[1]}. ${+m[2]}.`;o.deliverAt=`${m[3].padStart(2,'0')}:${m[4]}`}
    else if(m){o.deliverAt=`${m[1].padStart(2,'0')}:${m[2]}`}
    else if(/ihned|nejd/i.test(L[di]))o.deliverAt='ihned';
  }
  // poznámka: řádky mezi jménem a „doručit“ + cokoli s „pozn“
  const notes=[];
  if(pi>=0&&di>pi+2)for(let i=pi+2;i<di;i++)if(L[i].length>2)notes.push(L[i]);
  L.forEach(l=>{if(/pozn[aá]mk|pozn\.|vzkaz/i.test(l))notes.push(l.replace(/^[^:]*:\s*/,''))});
  o.note=notes.join(' ').trim();
  // platba
  const pl=L.find(l=>/^pl\w*ba\s+\S/i.test(l)&&!/^platba$/i.test(l));
  o.pay=pl?detectPay(pl):'';
  if(!o.pay){const h=L.find(l=>/^(hotov|kart|online|zaplac)/i.test(l));if(h)o.pay=detectPay(h)}
  if(!o.pay&&pi>=0)o.pay=detectPay(L.slice(pi).join(' '));
  // částky
  const vy=L.find(l=>/vybrat/i.test(l));
  const va=vy?amountIn(vy):null;
  let ce=null;
  for(let i=0;i<L.length&&!ce;i++)if(/^celkem\b/i.test(L[i])){
    if(amountIn(L[i])!=null)ce=L[i];
    else if(L[i+1]&&/^[\d\s.,]+\s*(kč|kc|czk)\.?$/i.test(L[i+1]))ce=L[i+1]; // částka spadla na další řádek
  }
  const hl=L.find(l=>/^(hotov|kart)/i.test(l)&&amountIn(l)!=null);
  o.total=ce?String(amountIn(ce)):hl?String(amountIn(hl)):va!=null?String(va):'';
  if(va!=null){o.collect=String(va);if(va===0&&!o.pay)o.pay='zaplaceno'}
  else if(o.pay==='zaplaceno')o.collect='0';
  else o.collect=hl?String(amountIn(hl)):o.total;
  // záloha, když chybí telefon: hledej adresu ve spodní části
  if(!o.street){
    const from=numIdx.length>1?numIdx[1]+1:Math.floor(L.length/2);
    const st=L.slice(from).find(l=>/^[A-Za-zÁ-ž][^\d:]{2,40}\s\d{1,5}[a-zA-Z]?(?:\/\d{1,5}[a-zA-Z]?)?(?:,.*)?$/.test(l)&&!/kč|celkem|dph|vybrat/i.test(l));
    if(st){const [s,...c]=st.split(',');o.street=s.trim();o.city=c.join(',').trim()}
  }
  if(!o.name){const n=L.slice(Math.max(0,pi)).find(l=>NAME_RE.test(l)&&!/Děkujeme|Pizzeria/i.test(l));if(n)o.name=n}
  // položky (bez hlavičky pizzerie)
  o.items=itemsFromLines(L);
  return o;
}
const itemsToText=items=>items.map(it=>`${it.q}x ${it.name}`+it.ex.map(e=>`\n+ ${e}`).join('')).join('\n');

/* ================= fotka → ořez účtenky, zvětšení, kontrast ================= */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('fotku se nepodařilo otevřít'));im.src=u})}
// najde svislý pruh účtenky: světlé sloupce, ve kterých je text (ne jen bílá zeď/stůl)
function findPaper(im){
  const W=im.naturalWidth,H=im.naturalHeight,sw=300,sh=Math.max(1,Math.round(H*sw/W));
  const c=document.createElement('canvas');c.width=sw;c.height=sh;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,sw,sh);
  const d=x.getImageData(0,0,sw,sh).data,mean=new Float32Array(sw),ink=new Float32Array(sw);
  for(let X=0;X<sw;X++){let s=0;const col=[];for(let Y=0;Y<sh;Y++){const k=(Y*sw+X)*4,g=.299*d[k]+.587*d[k+1]+.114*d[k+2];s+=g;col.push(g)}
    mean[X]=s/sh;let n=0;for(let Y=1;Y<sh;Y++)if(Math.abs(col[Y]-col[Y-1])>40)n++;ink[X]=n/sh}
  const srt=[...mean].sort((a,b)=>a-b),hi=srt[Math.floor(sw*.9)],lo=srt[Math.floor(sw*.2)];
  if(hi-lo<35)return null;                    // pozadí stejně světlé jako papír → neřež
  const thr=lo+(hi-lo)*.45;let best=null,st=-1;
  for(let X=0;X<=sw;X++){const on=X<sw&&mean[X]>thr;if(on&&st<0)st=X;
    if(!on&&st>=0){let t=0;for(let i=st;i<X;i++)t+=ink[i];if(!best||t>best.t)best={a:st,b:X,t};st=-1}}
  if(!best||(best.b-best.a)<sw*.28||(best.b-best.a)>sw*.93)return null;
  return {x0:Math.max(0,Math.floor(best.a*W/sw)-W*.02),x1:Math.min(W,Math.ceil(best.b*W/sw)+W*.02)};
}
// mode: 'crop' | 'full' | 'rot' (otočit o 90°)
async function prepImage(src,mode='crop'){
  const im=src instanceof HTMLImageElement?src:await loadImg(src);
  const W=im.naturalWidth,H=im.naturalHeight;
  let x0=0,x1=W;
  if(mode==='crop'){const r=findPaper(im);if(r){x0=r.x0;x1=r.x1}}
  const cw=x1-x0,rot=mode==='rot';
  const tw=rot?H:cw,th=rot?cw:H;               // rozměry výsledku
  let f=(mode==='crop'&&cw<W?1600:2000)/tw;if(tw*f*th*f>9e6)f=Math.sqrt(9e6/(tw*th));if(f>2.5)f=2.5;
  const c=document.createElement('canvas');c.width=Math.round(tw*f);c.height=Math.round(th*f);
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
  if(rot){x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(im,x0,0,cw,H,0,0,c.height,c.width)}
  else x.drawImage(im,x0,0,cw,H,0,0,c.width,c.height);
  const dd=x.getImageData(0,0,c.width,c.height),p=dd.data;
  for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];g=Math.max(0,Math.min(255,(g-128)*1.5+140));p[i]=p[i+1]=p[i+2]=g}
  x.putImageData(dd,0,0);
  // náhled vždy z celé fotky
  const t=document.createElement('canvas'),ts=Math.min(1,1100/Math.max(W,H));t.width=Math.round(W*ts);t.height=Math.round(H*ts);
  t.getContext('2d').drawImage(im,0,0,t.width,t.height);
  return {canvas:c,thumb:t.toDataURL('image/jpeg',.6),cropped:x1-x0<W,im};
}
const quality=o=>(o.street?2:0)+(o.phone?2:0)+(o.collect!==''?1:0)+(o.name?1:0)+(o.deliverAt?1:0);

/* ================= OCR (předehřeje se hned po spuštění) ================= */
let workerP=null,progCb=()=>{};
const STAT={'loading tesseract core':'Spouštím čtečku…','initializing tesseract':'Spouštím čtečku…','loading language traineddata':'Stahuji češtinu (jen poprvé)…','initializing api':'Připravuji…','recognizing text':'Čtu účtenku…'};
const ONWEB=/^https?:$/.test(location.protocol);
const NOWEB='Appka musí běžet z webové adresy (GitHub Pages / Netlify). V náhledu souboru čtení účtenek nefunguje.';
function errText(e){
  if(!e)return 'neznámá chyba';
  if(typeof e==='string')return e;
  if(e.message)return e.message;
  if(e.type)return ONWEB?'nepodařilo se načíst čtečku – zkontroluj připojení a zkus to znovu':NOWEB;
  return String(e);
}
function getWorker(){
  if(!ONWEB)return Promise.reject(new Error(NOWEB));
  if(!window.Tesseract)return Promise.reject(new Error('Čtečka se nenačetla – zkontroluj připojení a obnov stránku.'));
  if(!workerP)workerP=Tesseract.createWorker('ces',1,{
    workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/ces@1.0.0/4.0.0_best_int',
    gzip:true,logger:m=>progCb(m)}).then(async w=>{
    await w.setParameters({tessedit_pageseg_mode:'4',user_defined_dpi:'300',preserve_interword_spaces:'1'});return w;
  }).catch(e=>{workerP=null;throw new Error(errText(e))});
  return workerP;
}
async function ocr(canvas){const w=await getWorker();return (await w.recognize(canvas)).data.text||''}
if(ONWEB)setTimeout(()=>{getWorker().catch(()=>{})},800);

/* ================= geokódování (pro přesnou navigaci) ================= */
const geoCache=new Map();
function geoFetch(q){
  if(!geoCache.has(q))geoCache.set(q,fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cz&accept-language=cs&q='+encodeURIComponent(q))
    .then(r=>r.json()).then(j=>j[0]?{lat:+j[0].lat,lon:+j[0].lon}:null).catch(()=>{geoCache.delete(q);return null}));
  return geoCache.get(q);
}
// RÚIAN (ČÚZK) – státní registr adres, umí č. p. i č. ev.
const RUIAN='https://ags.cuzk.gov.cz/arcgis/rest/services/RUIAN/Vyhledavaci_sluzba_nad_daty_RUIAN/MapServer/exts/GeocodeSOE/findAddressCandidates';
const ruianCache=new Map();
function parseHouse(st){ // vrátí {ev:true/false, n:'398', rest:'Dobříš'}
  let m=st.match(/(?:\b(?:ev|evid)\.?\s*(?:č|čís|číslo)\.?|\bč\.?\s*ev\.?)\s*(\d+[a-z]?)/i);
  if(m)return {ev:true,n:m[1],rest:st.replace(m[0],'').replace(/[,\s]+$/,'').trim()};
  m=st.match(/(\d+[a-z]?)(?:\/\d+[a-z]?)?\s*$/i);
  return m?{ev:false,n:m[1],rest:st.slice(0,m.index).replace(/\bč\.?\s*p\.?\s*$/i,'').trim()}:{ev:false,n:'',rest:st};
}
async function ruianFetch(text,house){
  const key=text+'|'+house.ev+'|'+house.n;if(ruianCache.has(key))return ruianCache.get(key);
  let hit=null;
  try{
    const ctl=new AbortController(),tt=setTimeout(()=>ctl.abort(),7000);
    const r=await fetch(`${RUIAN}?SingleLine=${encodeURIComponent(text)}&outSR=4326&maxLocations=8&f=json`,{signal:ctl.signal});
    clearTimeout(tt);const j=await r.json();
    for(const c of (j.candidates||[])){
      const a=(c.address||(c.attributes&&c.attributes.Match_addr)||'')+'',x=+c.location.x,y=+c.location.y;
      if(!(y>48&&y<51.2&&x>12&&x<19))continue;                         // musí být WGS84 v ČR
      if(house.n&&!new RegExp('(^|[^\\d])'+house.n+'([^\\d]|$)').test(a))continue; // stejné číslo domu
      if(house.ev!==/ev/i.test(a))continue;                              // č. ev. ≠ č. p.
      if((c.score||0)<70)continue;
      hit={lat:y,lon:x};break;
    }
  }catch(e){hit=undefined}                                               // nedostupné → nekešovat
  if(hit!==undefined)ruianCache.set(key,hit);
  return hit||null;
}
async function ruianGeocode(o){
  const city=(o.city||settings.city||'').trim(),h=parseHouse((o.street||'').trim());
  if(!h.n)return null;
  const place=h.rest&&h.rest.toLowerCase()!==city.toLowerCase()?h.rest:'';
  const texts=h.ev?[`${city} č.ev. ${h.n}`,`č. ev. ${h.n}, ${city}`,place?`${place} č.ev. ${h.n}, ${city}`:'']
                  :[[place,h.n].filter(Boolean).join(' ')+', '+city,place?`${place} ${h.n}`:`${city} ${h.n}`];
  for(const t of texts.filter(Boolean)){const r=await ruianFetch(t,h);if(r)return r}
  return null;
}
// varianty adresy od nejpřesnější: celá adresa → bez „ev. č./č. p.“ → jen ulice → střed obce
function geoVariants(o){
  const city=(o.city||settings.city||'').trim(),st=(o.street||'').trim(),v=[];
  const add=(q,approx)=>{q=q.replace(/\s+/g,' ').replace(/^,\s*|,\s*$/g,'').trim();if(q&&!v.some(x=>x.q===q))v.push({q,approx})};
  add([st,city].filter(Boolean).join(', '),false);
  const clean=st.replace(/\b(ev\.?|evid\.?)\s*(č\.?|čís\.?|číslo)\s*/ig,'').replace(/\bč\.?\s*p\.?\s*/ig,'');
  add([clean,city].filter(Boolean).join(', '),false);
  const name=clean.replace(/[\d\/]+[a-z]?\b/gi,'').replace(/[,.]/g,' ').trim();
  if(name&&name.toLowerCase()!==city.toLowerCase())add([name,city].filter(Boolean).join(', '),true);
  if(city)add(city,true);
  return v;
}
async function geocode(o){
  if(!o.street||!ONWEB)return;
  const vs=geoVariants(o),key=vs[0]&&vs[0].q;
  if(o.geoQ===key&&o.lat)return;
  let hit=null;
  const ru=await ruianGeocode(o);if(ru)hit={...ru,approx:false};
  for(let i=0;i<vs.length&&!hit;i++){
    if(i&&!geoCache.has(vs[i].q))await new Promise(r=>setTimeout(r,1100)); // max 1 dotaz/s
    const r=await geoFetch(vs[i].q);if(r)hit={...r,approx:vs[i].approx};
  }
  if(hit){o.lat=hit.lat;o.lon=hit.lon;o.geoApprox=hit.approx}else{o.lat=o.lon=null;o.geoApprox=false}
  o.geoQ=key;
  if(orders.includes(o)){save();if(!drag)render()}
}

/* ================= navigace – rovnou spustí trasu ================= */
// aktuální poloha kurýra = start trasy (Mapy.com bez startu navigaci nespustí)
let myPos=null,geoOn=false;
function startGeo(){
  if(geoOn||!ONWEB||!navigator.geolocation)return;geoOn=true;
  navigator.geolocation.watchPosition(p=>{myPos={lat:p.coords.latitude,lon:p.coords.longitude};if(tab==='M')updateMe();if((settings.sort==='route'||tab==='M')&&(!routePos||hav(routePos,myPos)>300))scheduleRoute()},()=>{geoOn=false},{enableHighAccuracy:false,maximumAge:60000,timeout:30000});
}
const fx=n=>(+n).toFixed(6);

/* ================= trasa: nejlepší pořadí zastávek ================= */
const PIZZERIA={lat:49.78165,lon:14.16745}; // Pizzeria Martini, Mírové náměstí 190, Dobříš (přibližně)
let route=null,routeBusy=false,routeT=null,routeKey='',routePos=null;
const hav=(a,b)=>{const R=6371e3,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const matCache=new Map();
async function travelMatrix(pts){ // časy jízdy v sekundách po silnicích (OSRM), jinak odhad vzdušnou čarou
  const key=pts.map(p=>(+p.lat).toFixed(4)+','+(+p.lon).toFixed(4)).join(';');
  if(matCache.has(key))return matCache.get(key);
  let M=null,src='silnice';
  try{
    const ctl=new AbortController(),tt=setTimeout(()=>ctl.abort(),6000);
    const r=await fetch('https://router.project-osrm.org/table/v1/driving/'+pts.map(p=>`${fx(p.lon)},${fx(p.lat)}`).join(';')+'?annotations=duration',{signal:ctl.signal});
    clearTimeout(tt);const j=await r.json();
    if(j.code==='Ok'&&j.durations)M=j.durations.map(row=>row.map(v=>v==null?1e6:v));
  }catch(e){}
  if(!M){M=pts.map(a=>pts.map(b=>hav(a,b)*1.35/(35/3.6)));src='odhad'}
  const res={M,src};matCache.set(key,res);return res;
}
const STOP_S=120; // 2 min na předání u dveří
function plan(M,dues,now){ // dues[i] = čas „doručit v“ v ms nebo null; 0 v matici = start
  const n=dues.length,late=(i,t)=>dues[i]==null?0:Math.max(0,(now+t*1000-dues[i])/1000)*3;
  const cost=seq=>{let t=0,c=0,p=0;for(const i of seq){t+=M[p][i+1];c+=late(i,t);t+=STOP_S;p=i+1}return c+t};
  let best={cost:Infinity,seq:[]};
  if(n<=8){ // přesně: všechna pořadí s ořezáváním
    const used=new Array(n).fill(false),seq=[];
    const dfs=(p,t,c)=>{if(c+t>=best.cost)return;if(seq.length===n){best={cost:c+t,seq:[...seq]};return}
      for(let i=0;i<n;i++)if(!used[i]){const tt=t+M[p][i+1];used[i]=true;seq.push(i);dfs(i+1,tt+STOP_S,c+late(i,tt));seq.pop();used[i]=false}};
    dfs(0,0,0);
  }else{ // hodně zastávek: nejbližší soused + 2-opt
    let seq=[],left=[...Array(n).keys()],p=0;
    while(left.length){left.sort((a,b)=>M[p][a+1]-M[p][b+1]);const i=left.shift();seq.push(i);p=i+1}
    let bc=cost(seq),imp=true;
    while(imp){imp=false;for(let i=0;i<n-1;i++)for(let k=i+1;k<n;k++){const s=[...seq.slice(0,i),...seq.slice(i,k+1).reverse(),...seq.slice(k+1)],c=cost(s);if(c<bc-1){seq=s;bc=c;imp=true}}}
    best={cost:bc,seq};
  }
  const eta=[];let t=0,p=0;for(const i of best.seq){t+=M[p][i+1];eta.push(now+t*1000);t+=STOP_S;p=i+1}
  return {seq:best.seq,eta};
}
function dueOf(o){const tm=timing(o);return tm.diff==null?null:Date.now()+tm.diff*60000}
async function computeRoute(){
  if(settings.sort!=='route'&&tab!=='M')return;
  if(routeBusy){scheduleRoute();return}
  const act=orders.filter(o=>o.status!=='dorucena'&&o.lat);
  if(!act.length){route=null;render();return}
  routeBusy=true;
  try{
    const start=myPos||PIZZERIA,now=Date.now();
    const {M,src}=await travelMatrix([start,...act]);
    const r=plan(M,act.map(dueOf),now);
    route={ids:r.seq.map(i=>act[i].id),eta:Object.fromEntries(r.seq.map((i,k)=>[act[i].id,r.eta[k]])),from:myPos?'tvé polohy':'pizzerie',src,end:r.eta[r.eta.length-1]};
    routePos=myPos;
  }finally{routeBusy=false}
  render();
}

const telHref=p=>{let d=(p||'').replace(/[^\d+]/g,'');if(/^\d{9}$/.test(d))d='+420'+d;return d};
function timing(o){
  if(!o.deliverAt||o.deliverAt==='ihned')return {txt:o.deliverAt==='ihned'?'ihned':'',diff:null};
  const [hh,mm]=o.deliverAt.split(':').map(Number);if(isNaN(hh)||isNaN(mm))return {txt:o.deliverAt,diff:null};
  const d=new Date(o.created);d.setHours(hh,mm,0,0);
  if(d-o.created<-12*36e5)d.setDate(d.getDate()+1); // doručení po půlnoci
  return {txt:o.deliverAt,diff:Math.round((d-Date.now())/60000)};
}

let map=null,mapLayers=null,meMarker=null,lastFit='';
const geoCache2=new Map();
async function routeLine(pts){ // geometrie trasy po silnicích (OSRM), jinak rovné čáry
  const key=pts.map(p=>(+p.lat).toFixed(4)+','+(+p.lon).toFixed(4)).join(';');
  if(geoCache2.has(key))return geoCache2.get(key);
  let line=pts.map(p=>[p.lat,p.lon]);
  try{
    const ctl=new AbortController(),tt=setTimeout(()=>ctl.abort(),6000);
    const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+pts.map(p=>`${fx(p.lon)},${fx(p.lat)}`).join(';')+'?overview=full&geometries=geojson',{signal:ctl.signal});
    clearTimeout(tt);const j=await r.json();
    if(j.code==='Ok'&&j.routes&&j.routes[0])line=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
  }catch(e){}
  geoCache2.set(key,line);return line;
}

  }
}

let curPage='';
function openPage(p){
  curPage=p;const ttl={profil:'Profil',prehled:'Můj přehled',finance:'Finance',smeny:'Směny',nastaveni:'Nastavení',info:'Jak appka funguje'}[p];
  $('pTtl').textContent=ttl;$('pBody').innerHTML=PAGES[p]();$('page').classList.add('on');$('page').scrollTop=0;$('page').classList.remove('scrolled');
  (BIND[p]||(()=>{}))();
}
function closePage(){$('page').classList.remove('on');curPage='';render()}
$('pBack').onclick=closePage;
$('page').addEventListener('scroll',()=>$('page').classList.toggle('scrolled',$('page').scrollTop>60));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('fb').classList.contains('on'))closeFb();else if($('page').classList.contains('on'))closePage();else closeDrawer()}});
const done=()=>orders.filter(o=>o.status==='dorucena');
const PAGES={
  profil:()=>`<h1 class="h1">Profil</h1><div class="prof">
    <div class="lab">Jméno kurýra</div><div class="val">${esc(settings.name||'Nenastaveno')}</div>
    <div class="lab">Rozvážím pro</div><div class="val">Pizzeria Martini, Dobříš</div>
    <div class="lab">Stav</div><div class="val">${settings.shiftStart?'Ve směně od '+hhmm(settings.shiftStart):'Mimo směnu'}</div>
    <div class="lab">Odjeté směny</div><div class="val">${shifts.length}</div>
    <div class="lab">Doručeno celkem</div><div class="val">${shifts.reduce((s,x)=>s+x.count,0)+done().length}</div></div>
    <h2 class="h2">Účet</h2><p class="note2">Jméno změníš v Nastavení. Data jsou uložená jen v tomhle telefonu.</p>`,
  prehled:()=>{
    const d=done(),sh=settings.shiftStart,hrs=sh?Math.max(.25,(Date.now()-sh)/36e5):0,perH=sh?d.length/hrs:0;
    const times=d.filter(o=>o.done&&o.created).map(o=>(o.done-o.created)/60000),avg=times.length?Math.round(times.reduce((a,b)=>a+b,0)/times.length):0;
    const by=new Array(24).fill(0);d.forEach(o=>{if(o.done)by[new Date(o.done).getHours()]++});
    const from=sh?new Date(sh).getHours():Math.max(0,new Date().getHours()-5),to=Math.max(from+5,new Date().getHours()),mx=Math.max(1,...by);
    const bars=[];for(let x=from;x<=Math.min(23,to);x++)bars.push(`<i class="${x===new Date().getHours()?'hot':''}" style="height:${6+by[x]/mx*100}%"><span>${x}</span></i>`);
    const g=Math.min(1,perH/4),a=Math.PI*(1-g),gx=110+90*Math.cos(a),gy=115-90*Math.sin(a);
    return `<h1 class="h1">Můj přehled</h1><p class="lead">Ahoj${settings.name?' '+esc(settings.name.split(' ')[0]):''}! Tady je tvoje dnešní směna.</p><p class="note2">Počítá se z objednávek v tomhle telefonu.</p>
    <h2 class="h2">Doručené objednávky</h2>
    <div class="bigcard"><div class="n">${d.length}</div><div class="l">Doručené objednávky</div>${ic('bag').replace('class="i"','class="i deco"')}</div>
    <div class="info">${ic('info')}<span>${d.length?`Vybraná hotovost ${kc(cashDone())}.`:'Zatím žádná doručená objednávka.'}</span></div>
    <h2 class="h2">Doručení za hodinu</h2>
    <svg class="gauge" viewBox="0 0 220 130"><path d="M20 115 A90 90 0 0 1 200 115" fill="none" stroke="#2B3146" stroke-width="12" stroke-linecap="round"/>${g>0?`<path d="M20 115 A90 90 0 0 1 ${gx.toFixed(1)} ${gy.toFixed(1)}" fill="none" stroke="#E8402B" stroke-width="12" stroke-linecap="round"/>`:''}<text x="110" y="112" text-anchor="middle" fill="#EDEAE5" font-family="Fira Sans" font-weight="900" font-size="46">${perH.toFixed(1).replace('.',',')}</text></svg>
    <div class="info">${ic('info')}<span>${sh?`Ve směně ${dur(Date.now()-sh)}.`:'Směna začne s první objednávkou.'}</span></div>
    <h2 class="h2">Průměrná doba doručení</h2>
    <svg class="ring" viewBox="0 0 190 190"><circle cx="95" cy="95" r="80" fill="none" stroke="#2B3146" stroke-width="10"/>${avg?`<circle cx="95" cy="95" r="80" fill="none" stroke="#E8402B" stroke-width="10" stroke-linecap="round" stroke-dasharray="${Math.min(1,avg/60)*502} 502" transform="rotate(-90 95 95)"/>`:''}<text x="95" y="108" text-anchor="middle" fill="#EDEAE5" font-family="Fira Sans" font-weight="900" font-size="44">${avg}′</text></svg>
    <div class="info${avg>45?' warn2':''}">${ic(avg>45?'alert':'info')}<span>${avg?`Od vyfocení účtenky po doručení průměrně ${avg} min.`:'Ukáže se po prvním doručení.'}</span></div>
    <h2 class="h2">Doručení podle hodin</h2><div class="panel"><div class="bars">${bars.join('')}</div><div style="height:22px"></div></div>`;
  },
  finance:()=>{
    const d=done(),s=p=>d.filter(o=>o.pay===p).reduce((a,o)=>a+(+o.collect||0),0),paid=d.filter(o=>o.pay==='zaplaceno').reduce((a,o)=>a+(+o.total||0),0);
    const pend=orders.filter(o=>o.status!=='dorucena'&&o.pay==='hotove').reduce((a,o)=>a+(+o.collect||0),0);
    const tx=[...d].sort((a,b)=>(b.done||0)-(a.done||0)).map(o=>`<div class="tx"><div class="a"><b>#${esc(o.num)} ${esc(o.street||'')}</b><span>${o.done?hhmm(o.done):''} · ${o.pay==='hotove'?'Hotově':o.pay==='karta'?'Kartou':o.pay==='zaplaceno'?'Zaplaceno online':'Neznámá platba'}</span></div><div class="v ${o.pay==='hotove'?'plus':''}">${o.pay==='zaplaceno'?kc(o.total):'+'+kc(o.collect)}</div></div>`).join('');
    return `<h1 class="h1">Finance</h1>
    <div class="panel"><div class="cap">Hotovost k odevzdání</div><div class="money">${kc(s('hotove'))}</div>
    <div class="kv"><span>Ještě vybrat</span><b>${kc(pend)}</b></div>
    <div class="kv"><span>Kartou</span><b>${kc(s('karta'))}</b></div>
    <div class="kv"><span>Zaplaceno online</span><b>${kc(paid)}</b></div>
    <div class="kv"><span>Tržba celkem</span><b>${kc(s('hotove')+s('karta')+paid)}</b></div></div>
    <h2 class="h1" style="font-size:34px;margin-top:30px">Nedávné transakce</h2>${tx?`<div class="dayh">${czDay(Date.now())}</div>${tx}`:'<p class="note2">Zatím žádná doručená objednávka.</p>'}`;
  },
  smeny:()=>{
    const sh=settings.shiftStart,d=done();
    const hist=[...shifts].reverse().map(x=>`<div class="tx"><div class="a"><b>${czDay(x.start)}</b><span>${hhmm(x.start)}–${hhmm(x.end)} · ${x.count} doručení</span></div><div class="v plus">${kc(x.cash)}</div></div>`).join('');
    return `<h1 class="h1">Směny</h1>
    <div class="panel"><div class="cap">${sh?'Aktuální směna':'Mimo směnu'}</div><div class="money">${sh?dur(Date.now()-sh):'—'}</div>
    <div class="kv"><span>Začátek</span><b>${sh?hhmm(sh):'—'}</b></div>
    <div class="kv"><span>Doručeno</span><b>${d.length}</b></div>
    <div class="kv"><span>Hotovost k odevzdání</span><b>${kc(cashDone())}</b></div></div>
    <div class="btns" style="max-width:none;margin-top:16px">${sh?`<button class="btn danger" id="endShift">${ic('trash')}Ukončit směnu</button>`:`<button class="btn pri" id="startShift">Začít směnu</button>`}</div>
    <p class="note2" style="margin-top:10px">Ukončení směny uloží souhrn do historie a vyčistí seznam objednávek.</p>
    <h2 class="h2">Historie směn</h2>${hist||'<p class="note2">Zatím žádná ukončená směna.</p>'}`;
  },
  nastaveni:()=>{
    const apps=['mapy:Mapy.com','google:Google','waze:Waze','apple:Apple'].map(x=>{const [v,l]=x.split(':');return `<button type="button" data-v="${v}" class="${settings.navApp===v?'on':''}">${l}</button>`}).join('');
    return `<h1 class="h1">Nastavení</h1>
    <h2 class="h2">Navigace</h2><div class="fld"><span>Navigovat přes</span><div class="seg" id="sNav">${apps}</div></div><p class="hint">Tlačítko Navigace rovnou spustí trasu v této aplikaci.</p>
    <h2 class="h2">Rozvoz</h2><label class="fld"><span>Výchozí obec</span><input id="sCity" value="${esc(settings.city)}" placeholder="např. Dobříš"></label><p class="hint">Doplní se k adrese, když na účtence obec chybí.</p>
    <h2 class="h2">Profil</h2><label class="fld"><span>Jméno kurýra</span><input id="sName" value="${esc(settings.name||'')}" placeholder="např. Pepa" autocomplete="name"></label>
    <h2 class="h2">Zpětná vazba</h2><label class="fld"><span>Posílat hodnocení na e-mail</span><input id="sFb" type="email" inputmode="email" value="${esc(settings.fbEmail||'')}" placeholder="např. jan@seznam.cz"></label><p class="hint">Když je prázdné, hodnocení se jen uloží v telefonu.</p>
    <p class="note2" style="margin-top:20px">Verze appky: ${APP_VERSION}</p>`;
  },
  info:()=>`<h1 class="h1">Jak appka funguje</h1>
    <div class="srow"><span class="t">Foto<small>Vyfoť účtenku ze Speedla, appka ji přečte a zkontroluješ údaje.</small></span></div>
    <div class="srow"><span class="t">Slider<small>Přetáhni „Vyzvednuta“ a pak „Doručena“. Ukliknutí vrátíš tlačítkem Zpět.</small></span></div>
    <div class="srow"><span class="t">Trasa<small>Ikona trasy seřadí objednávky do nejlepšího pořadí od tvé polohy.</small></span></div>
    <div class="srow"><span class="t">Mapa<small>Ukáže zastávky a nakreslenou trasu, tlačítko spustí navigaci na první.</small></span></div>
    <div class="srow"><span class="t">Barvy<small>Červená = vybrat hotově, modrá = kartou nebo zaplaceno, zelená = doručeno.</small></span></div>`
};
const BIND={
  nastaveni:()=>{
    $('sNav').onclick=e=>{const b=e.target.closest('button');if(!b)return;settings.navApp=b.dataset.v;saveSettings();[...$('sNav').children].forEach(x=>x.classList.toggle('on',x===b))};
    const sv=()=>{settings.city=$('sCity').value.trim();settings.name=$('sName').value.trim();settings.fbEmail=$('sFb').value.trim();saveSettings()};
    ['sCity','sName','sFb'].forEach(id=>$(id).addEventListener('input',sv));
  },
  smeny:()=>{
    if($('startShift'))$('startShift').onclick=()=>{settings.shiftStart=Date.now();saveSettings();openPage('smeny');toast('Směna začala')};
    if($('endShift')){let armed=false;$('endShift').onclick=()=>{
      if(!armed){armed=true;$('endShift').innerHTML=`${ic('trash')}Opravdu ukončit? Smaže ${orders.length} obj.`;return}
      const d=done(),entry={start:settings.shiftStart||Date.now(),end:Date.now(),count:d.length,cash:cashDone()};
      const bo=orders,bs=settings.shiftStart;
      shifts.push(entry);saveShifts();orders=[];save();settings.shiftStart=null;saveSettings();openPage('smeny');
      toast('Směna ukončena',()=>{shifts.pop();saveShifts();orders=bo;save();settings.shiftStart=bs;saveSettings();openPage('smeny')});
    }}
  }
};

/* ================= hodnocení při spuštění ================= */
const FBKEY='martini.fb.v1';let fbRate=0;
function openFb(){
  fbRate=0;$('fbC').value='';$('fbSend').disabled=true;
  $('fbStars').innerHTML=[1,2,3,4,5].map(n=>`<button data-n="${n}" aria-label="${n} z 5">${ic('star')}</button>`).join('');
  $('fb').classList.add('on');
}
function closeFb(){$('fb').classList.remove('on');try{localStorage.setItem(FBKEY+'.last',new Date().toDateString())}catch(e){}}
$('fbStars').onclick=e=>{const b=e.target.closest('button');if(!b)return;fbRate=+b.dataset.n;[...$('fbStars').children].forEach(x=>x.classList.toggle('on',+x.dataset.n<=fbRate));$('fbSend').disabled=false};
$('fbX').onclick=closeFb;$('fbSkip').onclick=closeFb;
$('fbSend').onclick=()=>{
  if(!fbRate)return;const c=$('fbC').value.trim();
  try{const l=JSON.parse(localStorage.getItem(FBKEY)||'[]');l.push({at:Date.now(),rate:fbRate,comment:c,v:APP_VERSION});localStorage.setItem(FBKEY,JSON.stringify(l.slice(-50)))}catch(e){}
  closeFb();toast('Díky za hodnocení!');
  if(settings.fbEmail){const body=`Hodnocení: ${'★'.repeat(fbRate)}${'☆'.repeat(5-fbRate)} (${fbRate}/5)\n\n${c}\n\nVerze ${APP_VERSION}`;
    setTimeout(()=>{location.href=`mailto:${encodeURIComponent(settings.fbEmail)}?subject=${encodeURIComponent('Martini rozvoz – hodnocení appky')}&body=${encodeURIComponent(body)}`},300)}
};
function maybeFb(){let last='';try{last=localStorage.getItem(FBKEY+'.last')||''}catch(e){}if(last!==new Date().toDateString())setTimeout(()=>{if(!document.querySelector('.sheet.on'))openFb()},1200)}

// převzetí dat ze staré verze
try{if(!orders.length){const old=JSON.parse(localStorage.getItem('martini.orders.v1')||'[]');if(old.length){orders=old.map(o=>({...o,collect:o.pay==='zaplaceno'?'0':o.total}));save()}}}catch(e){}
if(!settings.shiftStart){const a=orders.filter(o=>o.status!=='dorucena'||o.done);if(a.length){settings.shiftStart=Math.min(...a.map(o=>o.created||Date.now()));saveSettings()}}
render();
maybeFb();
try{const u=sessionStorage.getItem('martini.updated');if(u){sessionStorage.removeItem('martini.updated');setTimeout(()=>toast('Appka aktualizována'),400)}}catch(e){}
setTimeout(startGeo,1500);
(async()=>{for(const o of orders.filter(o=>o.street&&!o.lat&&o.status!=='dorucena')){await geocode(o);await new Promise(r=>setTimeout(r,1100))}})();
window.__app={parseReceipt,prepImage};
}
</script>
</body>
</html>
